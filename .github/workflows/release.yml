name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match VERSION file ($version)" >&2
            exit 1
          fi

      - name: Run unit suite
        run: zsh tests/unit.sh

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
