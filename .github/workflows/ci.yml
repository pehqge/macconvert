name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ShellCheck doesn't support zsh, so correctness is covered by the unit
    # suite: zsh -n on every file, manifest integrity, bundle generation
    # validated with plutil, config round-trip, and updater semver tests.
    name: Unit tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run unit suite
        run: zsh tests/unit.sh
